[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalprobe"
version = "0.1.0"
description = "Auditing small unsupported claims in otherwise grounded RAG answers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2,<7"]

[project.scripts]
evalprobe = "evalprobe.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalprobe"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
